# cargo deny (RFC 0020): known advisories, licences, duplicate or banned
# crates, and where crates come from. Run by the audit jobs:
#   cargo deny --locked check advisories bans licenses sources

[graph]
# The released targets; dependencies of other platforms are not checked.
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]

[advisories]
# Every advisory of the RustSec database fails, also unmaintained crates of
# the dependencies; a reviewed exception goes into `ignore` with a reason.
unmaintained = "all"
yanked = "deny"
ignore = [
  # bincode 1.3.3, used by syntect to load its grammars: unmaintained since
  # 2025, not vulnerable; the team calls 1.3.3 complete. Drop this when
  # syntect moves off it.
  { id = "RUSTSEC-2025-0141", reason = "unmaintained, no known vulnerability; via syntect" },
]

[licenses]
# clai is MIT OR Apache-2.0; these licences of dependencies are compatible.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  "0BSD",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
