[package]
name = "clai"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "AI coding agent for the terminal, with tools behind permission rules"
authors = ["Aleksandr Smolkov <sascha.smolkov@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/smolkov/clai"
homepage = "https://github.com/smolkov/clai"
readme = "readme.md"
keywords = ["ai", "agent", "llm", "cli", "tui"]
categories = ["command-line-utilities", "development-tools"]
include = [
  "/src/**",
  "/themes/**",
  "/tests/**",
  "/readme.md",
  "/CHANGELOG.md",
  "/LICENSE-MIT",
  "/LICENSE-APACHE",
]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
globset = "0.4.21"
ignore = "0.4.34"
indexmap = { version = "2.14.2", features = ["serde"] }
nix = { version = "0.31.3", default-features = false, features = ["signal", "process", "fs", "user", "term"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "process", "io-util", "fs", "signal"] }
tokio-util = "0.7.20"
toml = { version = "1.1.8", features = ["preserve_order"] }
toml_edit = "0.25"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-width = "0.2.3"
webpki-root-certs = "1.0.11"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "unwind"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util"] }

# Debian package (`ci/deb.sh`, RFC 0020). Built from the static musl binary;
# the files in target/deb-assets/ are written by `ci/deb.sh` first.
[package.metadata.deb]
maintainer = "Aleksandr Smolkov <sascha.smolkov@gmail.com>"
copyright = "2026, Aleksandr Smolkov"
extended-description = """\
clai is an AI coding agent for the terminal. You describe a task in plain \
language; clai sends it to a large language model, runs the tool calls the \
model asks for (read and edit files, run commands) behind permission rules, \
and shows every change and command."""
section = "devel"
priority = "optional"
recommends = "git"
suggests = "wl-clipboard | xclip | xsel"
revision = "1"
assets = [
  ["target/release/clai", "usr/bin/", "755"],
  ["target/deb-assets/clai.bash", "usr/share/bash-completion/completions/clai", "644"],
  ["target/deb-assets/_clai", "usr/share/zsh/vendor-completions/_clai", "644"],
  ["target/deb-assets/clai.fish", "usr/share/fish/vendor_completions.d/clai.fish", "644"],
  ["readme.md", "usr/share/doc/clai/README.md", "644"],
  ["target/deb-assets/changelog.Debian.gz", "usr/share/doc/clai/changelog.Debian.gz", "644"],
  ["target/deb-assets/changelog.gz", "usr/share/doc/clai/changelog.gz", "644"],
  ["debian/clai.lintian-overrides", "usr/share/lintian/overrides/clai", "644"],
]

