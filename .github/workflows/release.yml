# A tag vX.Y.Z builds, packs and publishes a release (RFC 0020): static Linux
# binaries (musl) and macOS binaries as archives, Debian packages, checksums,
# provenance, the notes from CHANGELOG.md; then crates.io for releases that
# are not pre-releases. The work is in ci/*.sh.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          version=$(sh ci/version.sh tag "$GITHUB_REF_NAME")
          sh ci/notes.sh "$version" >/dev/null
          if sh ci/version.sh prerelease "$version"; then pre=true; else pre=false; fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "prerelease=$pre" >>"$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh ci/check.sh
      - run: sh ci/version.sh toolchain
      - run: sh ci/crate.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh ci/test.sh

  build:
    needs: [version, check, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            deb: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            deb: true
          - target: aarch64-apple-darwin
            os: macos-15
            deb: false
          # Cross-built on the arm64 runner: the Apple SDK has both.
          - target: x86_64-apple-darwin
            os: macos-15
            deb: false
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools lintian
      - run: sh ci/build.sh "${{ matrix.target }}"
      - run: sh ci/package.sh "${{ matrix.target }}" "$VERSION"
      - if: matrix.deb
        run: |
          cargo install --locked cargo-deb@3.8.0
          CLAI_REQUIRE_LINTIAN=1 sh ci/deb.sh "${{ matrix.target }}" "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  deb-test:
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:stable-slim", "ubuntu:24.04"]
        platform:
          - { arch: amd64, os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { arch: arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.platform.os }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.platform.target }}
          path: dist
      - run: sh ci/deb-test.sh dist/*_${{ matrix.platform.arch }}.deb

  release:
    needs: [version, build, deb-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: sh ci/checksums.sh dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          sh ci/notes.sh "$VERSION" >notes.md
          pre=""
          if [ "$PRERELEASE" = true ]; then pre="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" $pre --verify-tag \
            --title "clai $VERSION" --notes-file notes.md \
            dist/*.tar.gz dist/*.deb dist/SHA256SUMS

  # The first version is published by hand (see readme.md, "Release"); then
  # crates.io Trusted Publishing is set up for this repository, this file and
  # the crates-io environment, and this job publishes without a stored token.
  publish:
    needs: [version, release]
    if: needs.version.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
