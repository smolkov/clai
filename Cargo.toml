[package]
name = "clai"
version = "0.2.4"
edition = "2021"
email = "sascha.smolkov@gmail.com"
authors = ["Aleksandr Smolkov"]
description = "Command line ai assistent"
license = "MIT OR Apache-2.0"
repository = "https://github.com/smolkov/clai"
keywords = ["ai", "cli", "chatbot", "assistant"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = "0.4.20"
clap = { version = "4.6.6", features = ["derive"] }
anyhow = "1.0.104"
reqwest = { version = "0.13.4", features = ["json"] }
tokio = { version = "1.53.1", features = ["full"] }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
console = "0.16.4"
dirs = "6.0.0"
once_cell = "1.21.4"
secrecy = "0.10.3"
toml = "1.1.4"
async-trait = "0.1.92"
chrono = "0.4.45"
uuid = { version = "1.26.1", features = ["v4"] }
ratatui = "0.30.2"
crossterm = "0.29.0"
tui-big-text = "0.8.10"
