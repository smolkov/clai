<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">codeagent</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24283b"/>
      <stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc777"/>
      <stop offset="1" stop-color="#ff9e64"/>
    </linearGradient>
  </defs>

  <!-- Terminal window -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#tile)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="51.25" fill="none" stroke="#414868" stroke-width="1.5"/>
  <circle cx="54" cy="52" r="7" fill="#f7768e"/>
  <circle cx="78" cy="52" r="7" fill="#e0af68"/>
  <circle cx="102" cy="52" r="7" fill="#9ece6a"/>

  <!-- Prompt and cursor -->
  <path d="M60 104 L112 140 L60 176" fill="none" stroke="#7aa2f7" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="128" y="164" width="64" height="20" rx="10" fill="#9ece6a"/>

  <!-- The agent: a spark, like the activity glyph of the TUI -->
  <path d="M188 70 C191 92 196 97 218 100 C196 103 191 108 188 130 C185 108 180 103 158 100 C180 97 185 92 188 70 Z" fill="url(#spark)"/>
</svg>
