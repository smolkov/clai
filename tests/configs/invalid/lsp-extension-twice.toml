# One server per file extension.
default_model = "anthropic/sonnet"

[providers.anthropic]
api = "anthropic"

[providers.anthropic.models.sonnet]
id = "claude-sonnet-5-5"
context_window = 200000

[lsp.servers.ruff]
command    = ["ruff", "server"]
extensions = ["py"]

[lsp.servers.pylsp]
command    = ["pylsp"]
extensions = ["py"]
